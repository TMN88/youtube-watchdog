name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/run.cjs
      - run: node tests/install.cjs
      - run: sha256sum -c SHA256SUMS
